[package]
name = "tokentrim"
version = "0.1.0"
description = "Tokenizer - local prompt token compression for desktop"
authors = ["Tokenizer"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop shell only loads the statically exported Next.js UI, so the Rust
# side stays intentionally tiny: no network, no provider SDKs.
name = "tokentrim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
